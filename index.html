<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102722">
  <title>myLUAS — Live tram times</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1916;
      color: #f2faf6;
      --muted: #aac2b8;
      --accent: #baf17a;
      --border: #365248;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 32px, 760px); margin: 0 auto; padding: 40px 0 24px; }
    header { margin-bottom: 32px; }
    .eyebrow {
      color: var(--accent);
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { font-size: clamp(3rem, 12vw, 4.5rem); letter-spacing: -.07em; margin: 8px 0; }
    h1 span { color: var(--accent); }
    header p, footer { color: var(--muted); line-height: 1.6; }
    label { display: block; margin-bottom: 10px; font-weight: 650; }
    select, button {
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
    }
    select {
      width: 100%;
      padding: 12px;
      background: #18332a;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 10px 18px;
      background: var(--accent);
      color: #102018;
      cursor: pointer;
      font-weight: 750;
    }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 16px 0 24px;
    }
    #updated { font-size: .85rem; color: var(--muted); line-height: 1.5; }
    .panel {
      background: #102722;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .service-label { color: var(--accent); font-size: .8rem; font-weight: 750; }
    #message { margin: 8px 0 0; line-height: 1.6; white-space: pre-wrap; }
    #stop-name { font-size: 1.5rem; margin: 30px 0 16px; }
    #directions { display: grid; gap: 16px; }
    .direction { margin: 0; }
    .direction h3 { font-size: 1rem; margin: 0 0 8px; color: var(--muted); }
    .trams { list-style: none; padding: 0; margin: 0; }
    .tram {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }
    .tram:last-child { border-bottom: 0; padding-bottom: 0; }
    .destination { font-size: 1.05rem; overflow-wrap: anywhere; }
    .arrival { text-align: right; flex-shrink: 0; }
    .number {
      color: var(--accent);
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.05em;
      font-variant-numeric: tabular-nums;
    }
    .unit { display: block; font-size: .75rem; color: var(--muted); margin-top: 5px; }
    .empty { color: var(--muted); line-height: 1.6; }
    .error {
      background: #3d2024;
      border: 1px solid #dc8290;
      color: #ffe1e6;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }
    footer { margin-top: 36px; font-size: .75rem; }
    @media (min-width: 640px) {
      main { padding-top: 56px; }
      #directions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: no-preference) {
      button { transition: background .2s; }
      button:hover:not(:disabled) { background: #d2ffa0; }
    }
  </style>
</head>
<body>
  <!-- Calm forest colours, lime accents, and readable system typography. -->
  <main>
    <header>
      <div class="eyebrow">Dublin · Live tram departures</div>
      <h1>my<span>LUAS</span></h1>
      <p>Your stop. Your next tram.</p>
    </header>

    <label for="stop">Choose your stop</label>
    <select id="stop" disabled>
      <option value="MYS">Loading stops…</option>
    </select>

    <div class="status-row">
      <span id="updated" role="status">Waiting for live data…</span>
      <button id="refresh" type="button">Refresh</button>
    </div>

    <div id="storage-error" class="error" role="alert" hidden></div>
    <div id="error" class="error" role="alert" hidden></div>

    <section class="panel" aria-labelledby="service-heading">
      <div id="service-heading" class="service-label">SERVICE UPDATE</div>
      <p id="message">Fetching the latest service information…</p>
    </section>

    <section aria-labelledby="stop-name" id="departures" aria-busy="true">
      <h2 id="stop-name">Live departures</h2>
      <div id="directions"></div>
    </section>

    <footer>
      Refreshes automatically every 20 seconds.<br>
      Data: Transport Infrastructure Ireland. Built by Samuel Peluso for BDAIB.
    </footer>
  </main>

  <script>
    "use strict";

    const BASE_URL = "https://luas-class.kluxy.app";
    const STORAGE_KEY = "myLUAS.stop";
    const DEFAULT_STOP = "MYS";

    const stopSelect = document.getElementById("stop");
    const refreshButton = document.getElementById("refresh");
    const updated = document.getElementById("updated");
    const message = document.getElementById("message");
    const stopName = document.getElementById("stop-name");
    const directions = document.getElementById("directions");
    const departures = document.getElementById("departures");
    const errorBox = document.getElementById("error");
    const storageError = document.getElementById("storage-error");

    let stops = [];
    let selectedStop = DEFAULT_STOP;
    let activeController = null;
    let requestNumber = 0;
    let lastUpdated = null;
    let initialized = false;
    let initializing = false;

    function showError(element, text) {
      element.textContent = text;
      element.hidden = false;
    }

    function errorText(error) {
      return error instanceof Error ? error.message : String(error);
    }

    try {
      selectedStop = localStorage.getItem(STORAGE_KEY) || DEFAULT_STOP;
    } catch (error) {
      showError(storageError, "Your saved stop could not be read: " + errorText(error));
    }

    function rememberStop() {
      try {
        localStorage.setItem(STORAGE_KEY, selectedStop);
        storageError.hidden = true;
      } catch (error) {
        showError(storageError, "Your stop could not be saved: " + errorText(error));
      }
    }

    async function fetchJSON(path, signal) {
      const response = await fetch(BASE_URL + path, {
        signal,
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Request failed: HTTP " + response.status + " " + response.statusText);
      }

      try {
        return await response.json();
      } catch {
        throw new Error("The server returned invalid JSON.");
      }
    }

    function updateTimeLabel(failed = false) {
      if (!lastUpdated) {
        updated.textContent = failed ? "No live update received yet." : "Updating…";
        return;
      }

      updated.textContent = "Last updated: " +
        lastUpdated.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }) +
        (failed ? " · Update failed; times may be out of date." : "");
    }

    function validateForecast(data) {
      if (!data || typeof data.stopName !== "string" ||
          typeof data.message !== "string" || !Array.isArray(data.directions)) {
        throw new Error("The server returned an unexpected forecast format.");
      }

      for (const direction of data.directions) {
        if (!direction || typeof direction.name !== "string" ||
            !Array.isArray(direction.trams)) {
          throw new Error("The server returned invalid direction information.");
        }

        for (const tram of direction.trams.slice(0, 3)) {
          const due = tram && tram.due;
          if (!tram || typeof tram.destination !== "string" ||
              !["number", "string"].includes(typeof due) ||
              String(due).trim() === "" || !Number.isFinite(Number(due)) ||
              Number(due) < 0) {
            throw new Error("The server returned invalid tram arrival information.");
          }
        }
      }
    }

    function renderForecast(data) {
      stopName.textContent = data.stopName;
      message.textContent = data.message.trim() || "No service message at this time.";

      const fragment = document.createDocumentFragment();

      for (const direction of data.directions) {
        const card = document.createElement("section");
        card.className = "panel direction";

        const heading = document.createElement("h3");
        heading.textContent = direction.name;
        card.appendChild(heading);

        if (!direction.trams.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No trams currently forecast.";
          card.appendChild(empty);
        } else {
          const list = document.createElement("ul");
          list.className = "trams";

          for (const tram of direction.trams.slice(0, 3)) {
            const due = Number(tram.due);
            const row = document.createElement("li");
            row.className = "tram";

            const destination = document.createElement("span");
            destination.className = "destination";
            destination.textContent = tram.destination;

            const arrival = document.createElement("span");
            arrival.className = "arrival";
            arrival.setAttribute("aria-label", due === 0 ? "Due now" : due + " minutes");

            const number = document.createElement("span");
            number.className = "number";
            number.textContent = due === 0 ? "Due" : String(due);

            const unit = document.createElement("span");
            unit.className = "unit";
            unit.textContent = due === 0 ? "now" : due === 1 ? "minute" : "minutes";

            arrival.append(number, unit);
            row.append(destination, arrival);
            list.appendChild(row);
          }
          card.appendChild(list);
        }
        fragment.appendChild(card);
      }

      if (!data.directions.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No departures currently available for this stop.";
        fragment.appendChild(empty);
      }

      directions.replaceChildren(fragment);
    }

    async function refreshForecast(clearPrevious = false) {
      if (!initialized) return;

      const currentRequest = ++requestNumber;
      if (activeController) activeController.abort();
      activeController = new AbortController();
      const controller = activeController;
      let timedOut = false;

      const timeout = setTimeout(() => {
        timedOut = true;
        controller.abort();
      }, 12000);

      if (clearPrevious) {
        lastUpdated = null;
        directions.replaceChildren();
        stopName.textContent = stops.find(stop => stop.id === selectedStop)?.name || selectedStop;
        message.textContent = "Fetching the latest service information…";
      }

      errorBox.hidden = true;
      refreshButton.disabled = true;
      refreshButton.textContent = "Updating…";
      departures.setAttribute("aria-busy", "true");
      updateTimeLabel();

      try {
        const data = await fetchJSON(
          "/forecast?stop=" + encodeURIComponent(selectedStop),
          controller.signal
        );
        if (currentRequest !== requestNumber) return;

        validateForecast(data);
        renderForecast(data);
        lastUpdated = new Date();
        updateTimeLabel();
      } catch (error) {
        if (currentRequest !== requestNumber) return;

        showError(errorBox, timedOut
          ? "The live tram request timed out. Please try again."
          : "Could not load live trams: " + errorText(error));

        if (!lastUpdated) message.textContent = "Service information is currently unavailable.";
        updateTimeLabel(true);
      } finally {
        clearTimeout(timeout);
        if (currentRequest === requestNumber) {
          refreshButton.disabled = false;
          refreshButton.textContent = "Refresh";
          departures.setAttribute("aria-busy", "false");
          activeController = null;
        }
      }
    }

    async function initialize() {
      if (initializing) return;
      initializing = true;
      errorBox.hidden = true;
      refreshButton.disabled = true;
      refreshButton.textContent = "Loading…";

      const controller = new AbortController();
      let timedOut = false;
      const timeout = setTimeout(() => {
        timedOut = true;
        controller.abort();
      }, 12000);

      try {
        const data = await fetchJSON("/stops", controller.signal);
        if (!data || !Array.isArray(data.stops) || !data.stops.length ||
            data.stops.some(stop => !stop || typeof stop.id !== "string" ||
              typeof stop.name !== "string" || !["red", "green"].includes(stop.line))) {
          throw new Error("The server returned an invalid or empty stop list.");
        }

        stops = data.stops;
        const fragment = document.createDocumentFragment();

        for (const line of ["red", "green"]) {
          const group = document.createElement("optgroup");
          group.label = line === "red" ? "Red Line" : "Green Line";

          for (const stop of stops.filter(stop => stop.line === line)) {
            const option = document.createElement("option");
            option.value = stop.id;
            option.textContent = stop.name;
            group.appendChild(option);
          }
          fragment.appendChild(group);
        }

        if (!stops.some(stop => stop.id === selectedStop)) {
          selectedStop = stops.some(stop => stop.id === DEFAULT_STOP)
            ? DEFAULT_STOP
            : stops[0].id;
          rememberStop();
        }

        stopSelect.replaceChildren(fragment);
        stopSelect.value = selectedStop;
        stopSelect.disabled = false;
        initialized = true;
      } catch (error) {
        showError(errorBox, timedOut
          ? "The stop list request timed out. Press Retry to try again."
          : "Could not load stops: " + errorText(error));
        stopSelect.replaceChildren(new Option("Stops unavailable", ""));
        message.textContent = "Service information is currently unavailable.";
        updated.textContent = "No live update received yet.";
        departures.setAttribute("aria-busy", "false");
      } finally {
        clearTimeout(timeout);
        initializing = false;
        refreshButton.disabled = false;
        refreshButton.textContent = initialized ? "Refresh" : "Retry";
      }

      if (initialized) await refreshForecast(true);
    }

    stopSelect.addEventListener("change", () => {
      selectedStop = stopSelect.value;
      rememberStop();
      refreshForecast(true);
    });

    refreshButton.addEventListener("click", () => {
      if (initialized) refreshForecast();
      else initialize();
    });

    setInterval(() => {
      if (initialized && !activeController) refreshForecast();
      else if (!initialized && !initializing) initialize();
    }, 20000);

    initialize();
  </script>
</body>
</html>
